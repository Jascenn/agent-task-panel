name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build app
        run: zsh scripts/build.sh

      - name: Verify app bundle
        run: |
          test -d AgentTaskPanel.app/Contents/MacOS
          test -f AgentTaskPanel.app/Contents/Resources/server.py
          test -f AgentTaskPanel.app/Contents/Resources/agent-task-dashboard.html
          codesign --verify --deep AgentTaskPanel.app

      - name: Verify universal binary and minimum macOS
        run: |
          BIN=AgentTaskPanel.app/Contents/MacOS/AgentTaskPanel
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64
          xcrun vtool -show-build "$BIN" | grep -q "minos 12.0"

      - name: Python syntax check
        run: python3 -m py_compile src/server.py
